# Déploiement : utilise les images publiées sur Docker Hub, sans reconstruction locale.
services:
  backend:
    image: nourki2003/garderie-backend:latest
    container_name: garderie-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/api/garderie"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garderie-net

  frontend:
    image: nourki2003/garderie-frontend:latest
    container_name: garderie-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - garderie-net

networks:
  garderie-net:
    driver: bridge
